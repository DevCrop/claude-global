<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Global Workflow</title>
<style>
/* Direction: Claude Code's terminal look. One monospace face for everything (the font a terminal gives Claude Code),
   warm near-black canvas, Claude orange as the single accent, dim gray secondary text, hairline borders, no shadows.
   State is carried by badges (OK / WARN / FAIL / info), never by color alone. Charts update with transitions.
   Layout: one-screen app shell on desktop (KPI strip, pipeline, three panels); below 1100px it stacks and scrolls. */
:root {
  --bg: #faf9f5; --panel: #ffffff; --line: #e8e6dc; --fg: #141413; --muted: #5e5d59; --faint: #8a887f;
  --accent: #d77757; --accent-soft: #f6e6de; --accent-ink: #b9532f;
  --ok: #3f7a3a; --ok-soft: #e4efdf; --warn: #9a6200; --warn-soft: #f7ecd2; --bad: #b53333; --bad-soft: #f6e0dc; --info: #3c6fa8; --info-soft: #e1ebf6;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "D2Coding", "Malgun Gothic", Menlo, monospace;
  --s2: 8px; --s3: 12px; --s4: 16px;
  --r-sm: 4px; --r-lg: 8px;
  --t-xs: 11px; --t-sm: 12px; --t-md: 13px; --t-lg: 15px; --t-kpi: 26px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1e1d; --panel: #262624; --line: #3a3936; --fg: #e9e7df; --muted: #b7b4aa; --faint: #7f7d75;
  --accent: #d77757; --accent-soft: #3c2b24; --accent-ink: #eb9575;
  --ok: #7fc37a; --ok-soft: #24342a; --warn: #e3b25f; --warn-soft: #3a3020; --bad: #f08c82; --bad-soft: #402623; --info: #7fb0e6; --info-soft: #22303f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f1e1d; --panel: #262624; --line: #3a3936; --fg: #e9e7df; --muted: #b7b4aa; --faint: #7f7d75;
  --accent: #d77757; --accent-soft: #3c2b24; --accent-ink: #eb9575;
  --ok: #7fc37a; --ok-soft: #24342a; --warn: #e3b25f; --warn-soft: #3a3020; --bad: #f08c82; --bad-soft: #402623; --info: #7fb0e6; --info-soft: #22303f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--t-md)/1.5 var(--mono); }
.app { display: grid; grid-template-columns: 172px minmax(0, 1fr); min-height: 100%; }
@media (min-width: 1100px) { .app { height: 100%; } }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: var(--s4) var(--s2); display: flex; flex-direction: column; gap: 4px; align-content: start; }
.side .lbl { font-size: var(--t-xs); color: var(--faint); padding: 0 var(--s2) var(--s2); }
.side button { text-align: left; font-size: var(--t-sm); color: var(--muted); background: none; border: 1px solid transparent; border-radius: var(--r-sm); padding: 7px var(--s2); }
.side button:hover { color: var(--fg); background: var(--bg); }
.side button[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: var(--s2); } .side .lbl { display: none; } .side button { white-space: nowrap; } }
.view[hidden] { display: none !important; }
#v-monitor { display: grid; gap: var(--s3); grid-template-rows: auto auto 1fr; min-height: 0; }
.flow { display: grid; gap: var(--s3); align-content: start; min-height: 0; overflow: auto; }
.grid2 { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2); align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.kv .sub { grid-column: 1 / -1; color: var(--muted); font-size: var(--t-xs); }
.note { color: var(--muted); font-size: var(--t-xs); margin: 0; }
.cmd { font-size: var(--t-xs); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; overflow-x: auto; white-space: pre; }
.shell { min-height: 100%; padding: var(--s4); display: grid; gap: var(--s3); grid-template-rows: auto 1fr; align-content: start; }
@media (min-width: 1100px) { .shell { height: 100%; } }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* badges: the one state vocabulary used everywhere */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: var(--r-sm); font-size: var(--t-xs); font-weight: 600; letter-spacing: .02em; white-space: nowrap; background: var(--line); color: var(--muted); transition: background-color .3s var(--ease), color .3s var(--ease); }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--info-soft); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent-ink); }
.badge .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.live .pip { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.mark { color: var(--accent); font-size: var(--t-lg); font-weight: 700; }
.brand h1 { margin: 0; font-size: var(--t-lg); font-weight: 600; }
.brand .crumb { color: var(--faint); font-size: var(--t-sm); }
.meta { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
.btn { font-size: var(--t-xs); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 10px; transition: border-color .2s; }
.btn:hover { border-color: var(--faint); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4); min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--s3); overflow: hidden; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.ph h2 { margin: 0; font-size: var(--t-md); font-weight: 600; }
.ph h2::before { content: "› "; color: var(--accent); }
.ph .hint { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s3); }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: var(--s3) var(--s4); gap: 4px; }
.kpi .k { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); font-size: var(--t-xs); color: var(--muted); }
.kpi .v { font-size: var(--t-kpi); font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v small { font-size: var(--t-sm); font-weight: 400; color: var(--muted); margin-left: 6px; }
.kpi .n { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: var(--s2); padding: var(--s3); }
@media (max-width: 1100px) { .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 560px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.step { display: flex; flex-direction: column; gap: 3px; padding: var(--s2) var(--s3); border: 1px solid transparent; border-radius: var(--r-sm); min-width: 0; transition: background-color .3s var(--ease), border-color .3s var(--ease); }
.step .nm { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: var(--t-sm); font-weight: 600; }
.step .vl { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .wh { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.active { background: var(--accent-soft); border-color: var(--accent); }

/* main grid */
.main { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 4fr); min-height: 0; }
.col { display: flex; flex-direction: column; gap: var(--s3); min-height: 0; min-width: 0; }
.col > .panel { flex: 1 1 0; }

/* charts */
.chart { position: relative; flex: 1; min-height: 120px; max-height: 300px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { fill: var(--faint); font: 10px var(--mono); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .grid g, .chart .bar, .chart .val { transition: transform .6s var(--ease), y .6s var(--ease), height .6s var(--ease), opacity .3s; }
.chart .bar { fill: var(--accent); opacity: .4; }
.chart .bar.last { opacity: 1; }
.chart .bar.hot { opacity: .85; }
.chart .val { font-weight: 600; fill: var(--accent-ink); }
.chart .cursor { stroke: var(--faint); stroke-dasharray: 2 3; opacity: 0; transition: opacity .15s; }
.chart.hover .cursor { opacity: 1; }
#tip { position: fixed; z-index: 10; pointer-events: none; padding: 4px 8px; border-radius: var(--r-sm); background: var(--fg); color: var(--bg); font-size: var(--t-xs); opacity: 0; transition: opacity .12s; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--t-xs); color: var(--muted); }
.legend b { font-weight: 600; color: var(--fg); margin-left: 4px; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.stack i { display: block; height: 100%; background: var(--accent); transition: width .6s var(--ease); }

/* rows (events, PRs, checks) */
.rows { display: flex; flex-direction: column; min-height: 0; }
.row { display: grid; align-items: center; gap: var(--s2); padding: 7px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row.new { animation: enter .7s var(--ease); }
@keyframes enter { from { background: var(--accent-soft); transform: translateY(-6px); opacity: 0; } to { background: transparent; transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .row.new { animation: none; } .chart .grid g, .chart .bar, .chart .val, .stack i { transition: none; } }
.ev { grid-template-columns: 56px 116px minmax(0, 1fr); }
.ev time { font-size: var(--t-xs); color: var(--faint); }
.ev .badge { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pr { grid-template-columns: 36px 68px minmax(0, 1fr) auto; }
.pr .badge { justify-self: start; }
.pr .d { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }
.add { color: var(--ok); } .del { color: var(--bad); }
.chk { grid-template-columns: 64px minmax(0, 1fr); }
.aw { grid-template-columns: 76px minmax(0, 1fr) auto; }
.aw .badge { justify-self: start; }
.aw .t b { font-weight: 600; margin-right: 6px; }
.aw .chips { display: inline-flex; gap: 4px; }
.aw.gone .t { color: var(--faint); }
.chk .badge { justify-self: start; }
.empty { color: var(--faint); font-size: var(--t-sm); padding: var(--s2) 0; }
@media (min-width: 1100px) and (max-height: 900px) { #perDay { display: none; } }

dialog { width: min(860px, calc(100vw - 32px)); max-height: 80vh; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); color: var(--fg); padding: var(--s4); font-family: var(--mono); }
button.proj { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit; }
.adv { padding: var(--s2) var(--s3) var(--s3); background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: var(--s3); font-size: var(--t-sm); }
.adv .it { display: grid; gap: 2px; }
.adv a { color: var(--info); font-size: var(--t-xs); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s3); }
dialog h2 { margin: 0; font-size: var(--t-lg); }
dialog pre { margin: 0; font: 400 var(--t-xs)/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 56vh; overflow: auto; }
dialog pre .l-FAIL { color: var(--bad); font-weight: 700; } dialog pre .l-WARN { color: var(--warn); } dialog pre .l-PASS { color: var(--muted); }
.proj { grid-template-columns: minmax(90px, 1.2fr) repeat(5, minmax(0, 1fr)); }
.proj .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj.head { color: var(--faint); font-size: var(--t-xs); }
@media (max-width: 640px) { .proj { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .proj.head { display: none; } }
.tabs { display: flex; gap: var(--s2); margin-bottom: var(--s3); }
.tabs .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
/* stacked layout: must come after the panel rules above so it wins the cascade */
@media (max-width: 1099px) {
  .shell { grid-template-rows: none; grid-auto-rows: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .main, .col, .col > .panel { min-height: auto; }
  .col > .panel { flex: 0 0 auto; }
  .chart { flex: none; height: 170px; }
  #perDay { height: 100px !important; flex: none !important; }
}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="화면 탭">
  <div class="lbl">화면</div>
  <button type="button" data-tab="monitor">모니터링</button>
  <button type="button" data-tab="orch">오케스트레이션</button>
  <button type="button" data-tab="route">모델 라우팅</button>
  <button type="button" data-tab="feat">기능 목록</button>
  <button type="button" data-tab="prac">권장기준 점검</button>
  <button type="button" data-tab="dbg">에러·디버깅</button>
  <button type="button" data-tab="setup">프로젝트 셋업</button>
</aside>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">✻</span>
      <div><h1>Setup workflow</h1><div class="crumb">claude-global · <span id="branch">—</span></div></div>
    </div>
    <div class="meta">
      <span class="badge accent" id="mode">mode —</span>
      <span class="badge ok live" id="live"><span class="pip"></span><span id="liveText">연결 중</span></span>
      <button class="btn" id="projBtn" type="button">프로젝트 셋업</button>
      <button class="btn" id="logsBtn" type="button">전체 로그</button>
      <button class="btn" id="theme" type="button">테마</button>
    </div>
  </header>

  <section class="view" id="v-monitor">
  <div class="kpis" id="kpis"></div>
  <div class="panel pipe" id="pipe"></div>

  <div class="main">
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>활동</h2><span class="hint" id="sessionNote"></span></div>
        <div class="legend" id="mixLegend"></div>
        <div class="stack" id="mixBar"></div>
        <div class="chart" id="perMin"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>실시간 이벤트</h2><span class="hint">최근 8건</span></div>
        <div class="rows" id="stream"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>AO 워커</h2><span class="hint" id="aoNote"></span></div>
        <div class="rows" id="aoRows"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <div class="ph"><h2>변경 이력</h2><span class="hint" id="prNote"></span></div>
        <div class="rows" id="prs"></div>
        <div class="chart" id="perDay" style="min-height:110px;flex:0 0 110px"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>점검과 알림</h2><span class="hint" id="chkNote"></span></div>
        <div class="rows" id="checks"></div>
      </div>
    </div>
  </div>
  </section>
  <section class="view flow" id="v-orch" hidden></section>
  <section class="view flow" id="v-route" hidden></section>
  <section class="view flow" id="v-feat" hidden></section>
  <section class="view flow" id="v-prac" hidden></section>
  <section class="view flow" id="v-dbg" hidden></section>
  <section class="view flow" id="v-setup" hidden></section>
</div>
</div>
<div id="tip" role="tooltip"></div>

<dialog id="pdlg">
  <div class="dh"><h2>프로젝트 셋업</h2><button class="btn" id="pdlgClose" type="button">닫기</button></div>
  <div class="rows" id="projRows"></div>
  <p class="muted" id="projHint" style="font-size:var(--t-xs)"></p>
</dialog>

<dialog id="dlg">
  <div class="dh"><h2>전체 로그</h2><button class="btn" id="dlgClose" type="button">닫기</button></div>
  <div class="tabs"><button class="btn" id="tabV" type="button" aria-pressed="true">verify --live</button><button class="btn" id="tabR" type="button" aria-pressed="false">루틴 보고서</button><button class="btn" id="tabA" type="button" aria-pressed="false">AO 세션</button></div>
  <pre id="dlgPre" tabindex="0"></pre>
</dialog>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const badge = (tone, text, pip) => { const b = el("span", "badge " + tone); if (pip) b.append(el("span", "pip")); b.append(document.createTextNode(text)); return b; };
  const NS = "http://www.w3.org/2000/svg";
  const sv = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  let lastOk = 0, last = null, tab = "v";
  const seen = new Set(); let firstEvents = true;

  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  };
  const dlg = $("dlg");
  $("logsBtn").onclick = () => { fillDlg(); dlg.showModal(); };
  $("dlgClose").onclick = () => dlg.close();
  const pdlg = $("pdlg");
  $("projBtn").onclick = () => { fillProj(); pdlg.showModal(); }; $("pdlgClose").onclick = () => pdlg.close();
  const bd = (tone, txt) => el("span", "badge " + tone, txt);
  const open = new Set(), SRC = { memory: "https://code.claude.com/docs/en/memory", "best-practices": "https://code.claude.com/docs/en/best-practices", permissions: "https://code.claude.com/docs/en/permissions", mcp: "https://code.claude.com/docs/en/mcp", skills: "https://code.claude.com/docs/en/skills", hooks: "https://code.claude.com/docs/en/hooks-guide", "claude-global": "https://github.com/DevCrop/claude-global/blob/main/CLAUDE.md" };
  const ACT = { add: ["info", "추가"], fix: ["warn", "수정"], remove: ["bad", "제거"] };
  function fillProj(rowsEl, hintEl) {
    rowsEl = rowsEl || $("projRows"); hintEl = hintEl || $("projHint");
    const list = (last && last.projects) || [];
    hintEl.textContent = list.length ? "읽기 전용: 파일 유무·줄 수·설정 키·스크립트 이름만 읽고 파일 내용은 보내지 않습니다. 행을 누르면 무엇을 추가·수정·제거할지 나옵니다." : "추적할 프로젝트가 없습니다. state/projects.txt에 경로를 한 줄씩 적거나 PROJECT_DIRS를 지정하세요.";
    const head = el("div", "row proj head"); ["프로젝트", "지침", "Claude 연결", "settings", "규칙", "개선"].forEach((t) => head.append(el("span", null, t)));
    const nodes = [];
    list.forEach((p) => {
      const cs = p.checks || [], bad = cs.filter((c) => c.level === "bad").length;

      grid2(
        panel("메인 대화", "claude/settings.json", kv("model", bd("accent", r.main || "?")), kv("effortLevel", r.effort || "?"), kv("advisorModel", bd("accent", r.advisor || "없음")), kv("autoCompactWindow", r.autoCompact || "기본")),
        panel("일일 루틴", "routines/daily-update.md", el("p", "note", r.routine || "모델 줄 없음"))),
      panel("서브에이전트별 모델", "frontmatter model/effort", ...r.agents.map((a) => kv(a.name, bd(a.model === "haiku" ? "ok" : a.model === "opus" ? "warn" : "info", a.model + " · " + a.effort)))),
      panel("AO 프로젝트", r.ao && r.ao.length ? r.ao.length + "개" : "없음 또는 데몬 중지", r.ao && r.ao.length ? el("div", "note", r.ao.join(", ")) : el("p", "note", "AO 워커·리뷰어 모델은 ao project get <id>로 확인합니다."), cmd("ao project set-config <id> --model <m> --reviewer <m> --permission <mode>")),
      panel("라우팅 메모", "공식 문서·측정", ...r.notes.map((t) => kv(t))));
  }
  function drawFeat(v) {
    const f = inv.features;
    v.replaceChildren(
      grid2(
        panel("권한과 훅", "settings.json", kv("기본 모드", bd("accent", f.mode || "?")), kv("deny", f.deny + "개"), kv("ask", f.ask + "개"), ...Object.entries(f.denyKinds).map(([k, n]) => kv("· " + k, n + "개")), ...f.hooks.map((h) => kv("PreToolUse 훅", h.slice(0, 70)))),
        panel("플러그인·기타", "", ...f.plugins.map((p) => kv("플러그인", p)), kv("상태줄", f.statusLine ? "켜짐" : "없음"), kv("대시보드 화면", f.dashboard.join(" · ")))),
      panel("에이전트 " + f.agents.length, "", el("div", "note", f.agents.join(" · "))),
      panel("스킬 " + f.skills.length, "claude/skills/", ...f.skills.map((s) => kv(s.name, "", s.desc))),
      panel("스크립트 " + f.scripts.length, "scripts/", ...f.scripts.map((s) => kv(s.name, "", s.desc))),
      panel("일일 루틴 단계 " + f.routine.length, "", ...f.routine.map((t) => kv(t))));
  }
  function drawPrac(v) {
    const L = { ok: "충족", bad: "미충족", warn: "확인 필요" }, items = inv.practices, bad = items.filter((i) => i.level === "bad").length;
    v.replaceChildren(panel("권장 기준 대비", items.length + "개 항목 · 미충족 " + bad, el("p", "note", "각 항목은 파일에서 바로 계산합니다. 근거 문서는 공식 Claude Code 문서입니다."),
      ...items.map((i) => { const d = kv(i.what, bd(i.level, L[i.level] || i.level), i.evidence); const a = el("a", null, "근거: " + i.src); a.href = "https://code.claude.com/docs/en/" + i.src; a.target = "_blank"; a.rel = "noreferrer"; d.append(a); return d; })));
  }
  function drawDbg(v) {
    const d = inv.debug, vf = ((last && last.verify) || {}).lines || [], bad = vf.filter((l) => /^(FAIL|WARN)/.test(l));
    const KIND = { "hook-block": ["warn", "훅 차단"], "hook-error": ["bad", "훅 오류"], permission: ["warn", "권한 거부"], "tool-error": ["info", "도구 오류"] };
    const kb = (k) => bd(...(KIND[k] || ["info", k]));
    const blocked = ((last && last.ao && last.ao.sessions) || []).filter((x) => x.activity === "blocked" && !x.isTerminated);
    v.replaceChildren(
      grid2(
        panel("오류 종류", "최근 세션 로그 도구 결과 " + d.scanned + "건 중", ...(Object.keys(d.counts).length ? Object.entries(d.counts).map(([k, n]) => kv(kb(k), n + "건")) : [el("p", "note", "도구 오류가 없습니다.")])),
        panel("도구별 오류", "", ...(Object.keys(d.tools).length ? Object.entries(d.tools).sort((a, b) => b[1] - a[1]).map(([k, n]) => kv(k, n + "건")) : [el("p", "note", "없음")]))),
      panel("최근 오류 " + d.errors.length + "건", "내용은 보내지 않고 분류만", ...d.errors.slice().reverse().map((e) => kv(kb(e.kind), e.tool + " · " + hms(e.at), e.detail ? "차단된 파일: " + e.detail : ""))),
      panel("설정 점검 FAIL/WARN", "verify --live", ...(bad.length ? bad.map((l) => kv(l)) : [el("p", "note", "FAIL·WARN 없음")])),
      panel("AO 멈춤", "", ...(blocked.length ? blocked.map((x) => kv(x.id, bd("warn", "사용자 입력 대기"))) : [el("p", "note", "입력 대기 중인 워커 없음")])),
      panel("디버깅 명령", "직접 실행", cmd("bash scripts/verify.sh --live      # 설정·적용 상태"), cmd("bash scripts/qa-hooks.sh             # secret-guard 단위 시험"), cmd("bash scripts/qa-deny.sh --static      # deny 규칙의 rtk 짝"), cmd("QA_MODE=selftest bash scripts/qa-role-agents.sh <dir>   # 채점기 자체 시험"), cmd("bash scripts/qa-dashboard.sh         # 이 대시보드 검사")));
  }
  function drawSetup(v) {
    const rows = el("div", "rows"), hint = el("span", "hint");
    v.replaceChildren(panel("프로젝트 셋업 점검", "", hint, rows));
    fillProj(rows, hint);
  }
  const DRAW = { orch: drawOrch, route: drawRoute, feat: drawFeat, prac: drawPrac, dbg: drawDbg, setup: drawSetup };
  async function loadInv() {
    try { const r = await fetch("/api/inventory", { cache: "no-store" }); inv = await r.json(); } catch (e) { return; }
    if (curTab !== "monitor" && curTab !== "setup") show(curTab);
  }
  function show(t) {
    if (!TABS.includes(t)) t = "monitor";
    curTab = t;
    TABS.forEach((k) => { $("v-" + k).hidden = k !== t; });
    document.querySelectorAll(".side button").forEach((b) => { b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"); });
    try { history.replaceState(null, "", "#" + t); } catch (e) {}
    if (t === "monitor") return;
    if (t === "setup") return DRAW.setup($("v-setup"));
    if (!inv) { wait($("v-" + t)); loadInv(); return; }
    DRAW[t]($("v-" + t));
  }
  document.querySelectorAll(".side button").forEach((b) => { b.onclick = () => show(b.dataset.tab); });
  setInterval(() => { if (curTab !== "monitor" && curTab !== "setup") loadInv(); }, 15000);
  show((location.hash || "").slice(1));

  async function tick() {
    try { const r = await fetch("/api/state", { cache: "no-store" }); render(await r.json()); lastOk = Date.now(); if (curTab === "setup") show(curTab); } catch (e) { /* keep the last frame */ }
    const fresh = Date.now() - lastOk < 8000;
    $("live").className = "badge live " + (fresh ? "ok" : "bad"); $("liveText").textContent = fresh ? "LIVE · 3s" : "OFFLINE";
  }
  tick(); setInterval(tick, 3000);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { for (const k in charts) delete charts[k]; if (last) render(last); }, 150); });
})();
</script>
</body>
